name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64 -DWINUX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install executable
        shell: pwsh
        run: |
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE "dist"
          cmake --install build --config Release --prefix $installPrefix

      - name: Upload Winux executable
        uses: actions/upload-artifact@v7
        with:
          name: winux-windows-x64-prototype
          path: dist/winux.exe
          if-no-files-found: error
          retention-days: 14
